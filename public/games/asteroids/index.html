<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Asteroids 2D Vector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #040711; color: #f8fafc; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #game-wrap {
      position: relative; width: 560px; height: 500px; max-width: 95vw; max-height: 90vh;
      border: 2px solid #22d3ee; border-radius: 8px; box-shadow: 0 0 25px rgba(34, 211, 238, 0.2);
    }
    canvas { display: block; width: 100%; height: 100%; background: #020617; }
    #overlay {
      position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    h1 { font-size: 32px; color: #22d3ee; margin-bottom: 8px; text-shadow: 0 0 10px #22d3ee; }
    p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .btn {
      background: #22d3ee; color: #082f49; font-weight: bold; font-size: 14px; border: none;
      padding: 10px 28px; border-radius: 4px; cursor: pointer; transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    .hud {
      position: absolute; top: 12px; left: 16px; right: 16px; display: flex; justify-content: space-between;
      font-size: 14px; color: #22d3ee; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>LIVES: <span id="livesVal">3</span></div>
      <div>BEST: <span id="bestVal">0</span></div>
    </div>
    <canvas id="c" width="560" height="500"></canvas>
    <div id="overlay">
      <h1 id="overTitle">ASTEROIDS VECTOR</h1>
      <p id="overDesc">▲: Thrust | ◄ ►: Steer | Space: Fire Lasers</p>
      <button id="startBtn" class="btn">INITIALIZE</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function fx(freq, dur=0.08, type='sawtooth') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const bestVal = document.getElementById('bestVal');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let score = 0;
    let lives = 3;
    let best = parseInt(localStorage.getItem('asteroids_best') || '0', 10);
    bestVal.textContent = best;
    let isRunning = false;

    let ship = { x: 280, y: 250, r: 12, angle: -Math.PI / 2, rotSpd: 4, vx: 0, vy: 0, thrust: false };
    let lasers = [];
    let asteroids = [];
    let particles = [];
    let keys = {};

    function spawnAsteroid(x, y, r, tier) {
      const vertCount = 8 + Math.floor(Math.random() * 5);
      const offsets = [];
      for (let i = 0; i < vertCount; i++) {
        offsets.push((Math.random() * 0.4 + 0.8) * r);
      }
      asteroids.push({
        x: x !== undefined ? x : Math.random() * canvas.width,
        y: y !== undefined ? y : Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * (70 / tier),
        vy: (Math.random() - 0.5) * (70 / tier),
        angle: Math.random() * Math.PI * 2,
        rotSpd: (Math.random() - 0.5) * 1.5,
        r,
        tier,
        offsets,
        vertCount
      });
    }

    function initAsteroids(count = 4) {
      asteroids = [];
      for (let i = 0; i < count; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 120);
        spawnAsteroid(x, y, 40, 1);
      }
    }

    function start() {
      score = 0;
      lives = 3;
      scoreVal.textContent = '0';
      livesVal.textContent = '3';
      ship = { x: 280, y: 250, r: 12, angle: -Math.PI / 2, rotSpd: 4.2, vx: 0, vy: 0, thrust: false };
      lasers = [];
      particles = [];
      initAsteroids(5);
      overlay.style.display = 'none';
      isRunning = true;
      fx(500, 0.1, 'sine');
    }

    function gameOver() {
      isRunning = false;
      fx(100, 0.4, 'sawtooth');
      if (score > best) {
        best = score;
        localStorage.setItem('asteroids_best', best);
        bestVal.textContent = best;
      }
      overTitle.textContent = 'SYSTEM BREACHED';
      overDesc.textContent = `Score: ${score} | High Score: ${best}`;
      startBtn.textContent = 'RE-ENGAGE';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', start);

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (isRunning) {
          if (lasers.length < 5) {
            lasers.push({
              x: ship.x + Math.cos(ship.angle) * ship.r,
              y: ship.y + Math.sin(ship.angle) * ship.r,
              vx: Math.cos(ship.angle) * 420 + ship.vx,
              vy: Math.sin(ship.angle) * 420 + ship.vy,
              life: 1.1
            });
            fx(880, 0.05, 'triangle');
          }
        } else {
          start();
        }
      }
    });

    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (isRunning) {
        // Ship control
        if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= ship.rotSpd * dt;
        if (keys['ArrowRight'] || keys['KeyD']) ship.angle += ship.rotSpd * dt;
        ship.thrust = !!(keys['ArrowUp'] || keys['KeyW']);

        if (ship.thrust) {
          ship.vx += Math.cos(ship.angle) * 280 * dt;
          ship.vy += Math.sin(ship.angle) * 280 * dt;
          if (Math.random() < 0.3) fx(120, 0.03, 'square');
        }

        // Friction
        ship.vx *= Math.pow(0.85, dt);
        ship.vy *= Math.pow(0.85, dt);
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;

        // Wrap Ship
        if (ship.x < 0) ship.x = canvas.width;
        if (ship.x > canvas.width) ship.x = 0;
        if (ship.y < 0) ship.y = canvas.height;
        if (ship.y > canvas.height) ship.y = 0;

        // Lasers
        for (let l of lasers) {
          l.x += l.vx * dt;
          l.y += l.vy * dt;
          l.life -= dt;
          if (l.x < 0) l.x = canvas.width;
          if (l.x > canvas.width) l.x = 0;
          if (l.y < 0) l.y = canvas.height;
          if (l.y > canvas.height) l.y = 0;
        }
        lasers = lasers.filter(l => l.life > 0);

        // Asteroids update
        for (let a of asteroids) {
          a.x += a.vx * dt;
          a.y += a.vy * dt;
          a.angle += a.rotSpd * dt;
          if (a.x < -a.r) a.x = canvas.width + a.r;
          if (a.x > canvas.width + a.r) a.x = -a.r;
          if (a.y < -a.r) a.y = canvas.height + a.r;
          if (a.y > canvas.height + a.r) a.y = -a.r;

          // Ship collision
          if (Math.hypot(ship.x - a.x, ship.y - a.y) < ship.r + a.r) {
            lives--;
            livesVal.textContent = lives;
            fx(90, 0.3, 'sawtooth');
            ship.x = 280; ship.y = 250; ship.vx = 0; ship.vy = 0;
            if (lives <= 0) gameOver();
            break;
          }
        }

        // Laser vs Asteroids
        for (let li = lasers.length - 1; li >= 0; li--) {
          const l = lasers[li];
          for (let ai = asteroids.length - 1; ai >= 0; ai--) {
            const a = asteroids[ai];
            if (Math.hypot(l.x - a.x, l.y - a.y) < a.r) {
              lasers.splice(li, 1);
              fx(240, 0.12, 'sawtooth');
              score += a.tier * 25;
              scoreVal.textContent = score;

              // Split asteroid
              if (a.tier < 3) {
                spawnAsteroid(a.x, a.y, a.r / 1.8, a.tier + 1);
                spawnAsteroid(a.x, a.y, a.r / 1.8, a.tier + 1);
              }
              asteroids.splice(ai, 1);

              // Sparks
              for (let p = 0; p < 8; p++) {
                particles.push({
                  x: a.x, y: a.y,
                  vx: (Math.random() - 0.5) * 140,
                  vy: (Math.random() - 0.5) * 140,
                  life: 0.5
                });
              }

              // Next wave check
              if (asteroids.length === 0) {
                initAsteroids(6);
              }
              break;
            }
          }
        }

        // Particles
        for (let p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
        }
        particles = particles.filter(p => p.life > 0);
      }

      // RENDER
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 2;
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.beginPath();
      ctx.moveTo(ship.r, 0);
      ctx.lineTo(-ship.r, -ship.r * 0.7);
      ctx.lineTo(-ship.r * 0.4, 0);
      ctx.lineTo(-ship.r, ship.r * 0.7);
      ctx.closePath();
      ctx.stroke();

      if (ship.thrust) {
        ctx.strokeStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(-ship.r * 0.5, -4);
        ctx.lineTo(-ship.r * 1.4, 0);
        ctx.lineTo(-ship.r * 0.5, 4);
        ctx.stroke();
      }
      ctx.restore();

      // Draw Lasers
      ctx.fillStyle = '#38bdf8';
      for (let l of lasers) {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Asteroids
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.5;
      for (let a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.beginPath();
        for (let i = 0; i < a.vertCount; i++) {
          const theta = (i / a.vertCount) * Math.PI * 2;
          const r = a.offsets[i];
          const px = Math.cos(theta) * r;
          const py = Math.sin(theta) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      // Draw Particles
      ctx.fillStyle = '#f8fafc';
      for (let p of particles) {
        ctx.fillRect(p.x, p.y, 2, 2);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
