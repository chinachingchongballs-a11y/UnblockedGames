<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flappy Astro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #game-container {
      position: relative; width: 380px; height: 560px; max-width: 95vw; max-height: 95vh;
      border: 2px solid #38bdf8; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    canvas { display: block; width: 100%; height: 100%; background: #030712; }
    #overlay {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    h1 { font-size: 34px; font-weight: 900; color: #38bdf8; margin-bottom: 6px; letter-spacing: 1px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .btn {
      background: #38bdf8; color: #082f49; font-size: 16px; font-weight: 800; border: none;
      padding: 12px 32px; border-radius: 8px; cursor: pointer; transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    #score-hud {
      position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-size: 36px;
      font-weight: 900; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,0.8); z-index: 5;
    }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-hud">0</div>
    <canvas id="c" width="380" height="560"></canvas>
    <div id="overlay">
      <h1 id="overTitle">FLAPPY ASTRO</h1>
      <p id="overDesc">Tap screen or press Space to boost your rocket!</p>
      <button id="startBtn" class="btn">LAUNCH</button>
      <div class="hint">Click or Space to fly</div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function beep(freq, type='sine', dur=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreHud = document.getElementById('score-hud');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let state = 'MENU';
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);

    let bird = { x: 80, y: 250, vy: 0, rad: 14, rot: 0 };
    const GRAVITY = 750;
    const JUMP = -280;
    let pipes = [];
    let pipeTimer = 0;
    const PIPE_INTERVAL = 1.7;
    const GAP = 135;
    const SPEED = 140;

    // Stars
    let stars = [];
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * 380,
        y: Math.random() * 560,
        speed: 15 + Math.random() * 40,
        size: Math.random() * 2
      });
    }

    function flap() {
      if (state === 'MENU' || state === 'GAMEOVER') {
        startGame();
        return;
      }
      bird.vy = JUMP;
      beep(520, 'sine', 0.08);
    }

    function startGame() {
      state = 'PLAYING';
      overlay.style.display = 'none';
      score = 0;
      scoreHud.textContent = '0';
      bird.y = 250;
      bird.vy = 0;
      pipes = [];
      pipeTimer = 0.5;
    }

    function gameOver() {
      state = 'GAMEOVER';
      beep(140, 'sawtooth', 0.35);
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
      }
      overTitle.textContent = 'MISSION FAILED';
      overDesc.textContent = `Score: ${score} | Best: ${best}`;
      startBtn.textContent = 'RETRY';
      overlay.style.display = 'flex';
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });
    canvas.addEventListener('mousedown', flap);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
    startBtn.addEventListener('click', startGame);

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Draw background
      ctx.fillStyle = '#060914';
      ctx.fillRect(0, 0, 380, 560);

      // Stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      for (let s of stars) {
        s.x -= s.speed * dt;
        if (s.x < 0) s.x = 380;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      }

      if (state === 'PLAYING') {
        // Update Bird
        bird.vy += GRAVITY * dt;
        bird.y += bird.vy * dt;
        bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 400) * 0.8));

        // Ground / Ceiling collision
        if (bird.y + bird.rad >= 550 || bird.y - bird.rad <= 0) {
          gameOver();
        }

        // Spawn pipes
        pipeTimer += dt;
        if (pipeTimer > PIPE_INTERVAL) {
          pipeTimer = 0;
          const topH = 60 + Math.random() * (560 - GAP - 140);
          pipes.push({
            x: 390,
            topH: topH,
            bottomY: topH + GAP,
            w: 52,
            passed: false
          });
        }

        // Update Pipes
        for (let p of pipes) {
          p.x -= SPEED * dt;

          // Check pass
          if (!p.passed && p.x + p.w < bird.x) {
            p.passed = true;
            score++;
            scoreHud.textContent = score;
            beep(780, 'triangle', 0.08);
          }

          // Collision Check
          if (bird.x + bird.rad > p.x && bird.x - bird.rad < p.x + p.w) {
            if (bird.y - bird.rad < p.topH || bird.y + bird.rad > p.bottomY) {
              gameOver();
            }
          }
        }

        pipes = pipes.filter(p => p.x + p.w > -10);
      }

      // Draw Pipes (Neon electric pylons)
      for (let p of pipes) {
        ctx.fillStyle = '#0f2942';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;

        // Top Pipe
        ctx.fillRect(p.x, 0, p.w, p.topH);
        ctx.strokeRect(p.x, 0, p.w, p.topH);
        // Top Pipe Cap
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(p.x - 3, p.topH - 16, p.w + 6, 16);
        ctx.strokeRect(p.x - 3, p.topH - 16, p.w + 6, 16);

        // Bottom Pipe
        ctx.fillStyle = '#0f2942';
        ctx.fillRect(p.x, p.bottomY, p.w, 560 - p.bottomY);
        ctx.strokeRect(p.x, p.bottomY, p.w, 560 - p.bottomY);
        // Bottom Pipe Cap
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(p.x - 3, p.bottomY, p.w + 6, 16);
        ctx.strokeRect(p.x - 3, p.bottomY, p.w + 6, 16);
      }

      // Draw Rocket
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);

      // Thruster flame
      if (state === 'PLAYING') {
        ctx.fillStyle = Math.random() < 0.5 ? '#f97316' : '#eab308';
        ctx.beginPath();
        ctx.moveTo(-bird.rad, -4);
        ctx.lineTo(-bird.rad - 12 - Math.random() * 8, 0);
        ctx.lineTo(-bird.rad, 4);
        ctx.closePath();
        ctx.fill();
      }

      // Rocket Body
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.rad + 2, bird.rad - 2, 0, 0, Math.PI * 2);
      ctx.fill();

      // Cockpit visor
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.arc(4, -2, 6, 0, Math.PI * 2);
      ctx.fill();

      // Fin
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(-8, -8);
      ctx.lineTo(-14, -12);
      ctx.lineTo(-12, -2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-8, 8);
      ctx.lineTo(-14, 12);
      ctx.lineTo(-12, 2);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
