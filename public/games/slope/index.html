<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slope 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #090a10; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud {
      position: absolute; top: 16px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .metric { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: #94a3b8; }
    .val { font-size: 26px; font-weight: 800; color: #38bdf8; font-variant-numeric: tabular-nums; }
    #overlay {
      position: absolute; inset: 0; background: rgba(9, 10, 16, 0.85);
      backdrop-filter: blur(8px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10;
    }
    h1 { font-size: 42px; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; color: #38bdf8; text-transform: uppercase; text-shadow: 0 0 20px rgba(56,189,248,0.5); }
    p { color: #cbd5e1; margin-bottom: 24px; font-size: 15px; }
    .btn {
      background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; border: none;
      padding: 14px 36px; font-size: 16px; font-weight: 700; border-radius: 8px;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; letter-spacing: 1px;
      box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(2, 132, 199, 0.6); }
    .tips { margin-top: 24px; font-size: 13px; color: #64748b; }
    .key-badge { background: #1e293b; padding: 4px 8px; border-radius: 4px; color: #e2e8f0; font-family: monospace; font-size: 12px; margin: 0 3px; }
  </style>
</head>
<body>
  <div id="hud">
    <div>
      <div class="metric">Distance</div>
      <div id="scoreVal" class="val">0m</div>
    </div>
    <div style="text-align: right;">
      <div class="metric">Best</div>
      <div id="bestVal" class="val">0m</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="titleText">Slope Runner 3D</h1>
    <p id="subText">Speed down the endless neon grid. Dodge red blocks!</p>
    <button id="startBtn" class="btn">PLAY NOW</button>
    <div class="tips">Controls: <span class="key-badge">A / D</span> or <span class="key-badge">◄ / ►</span> to steer</div>
  </div>

  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const titleText = document.getElementById('titleText');
    const subText = document.getElementById('subText');

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Web Audio Sound FX
    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.1, gain = 0.1) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(gain, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let state = 'MENU'; // 'PLAYING', 'GAMEOVER'
    let score = 0;
    let best = parseInt(localStorage.getItem('slope_best') || '0', 10);
    bestVal.textContent = best + 'm';

    let ball = { x: 0, y: 0, z: 120, vx: 0, radius: 14, rot: 0 };
    let speed = 400;
    let trackSegments = [];
    const TRACK_WIDTH = 280;
    const SEG_LEN = 120;
    const NUM_SEGS = 40;
    let keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && state !== 'PLAYING') startGame();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Touch controls
    let touchX = null;
    window.addEventListener('touchstart', (e) => {
      if (state !== 'PLAYING') return;
      touchX = e.touches[0].clientX;
    });
    window.addEventListener('touchmove', (e) => {
      if (touchX !== null && state === 'PLAYING') {
        const dx = e.touches[0].clientX - touchX;
        ball.vx = (dx / 40) * 12;
      }
    });
    window.addEventListener('touchend', () => { touchX = null; ball.vx = 0; });

    function initTrack() {
      trackSegments = [];
      let currentZ = 0;
      for (let i = 0; i < NUM_SEGS; i++) {
        let hasObstacle = i > 4 && Math.random() < 0.45;
        let obsX = (Math.random() - 0.5) * (TRACK_WIDTH - 60);
        let obsW = 40 + Math.random() * 40;
        trackSegments.push({
          z: currentZ,
          hasObstacle,
          obsX,
          obsW,
          obsH: 35
        });
        currentZ += SEG_LEN;
      }
    }

    function startGame() {
      state = 'PLAYING';
      overlay.style.display = 'none';
      ball = { x: 0, y: 0, z: 120, vx: 0, radius: 14, rot: 0 };
      speed = 450;
      score = 0;
      scoreVal.textContent = '0m';
      initTrack();
      playBeep(440, 'triangle', 0.15, 0.15);
    }

    function gameOver() {
      state = 'GAMEOVER';
      playBeep(120, 'sawtooth', 0.4, 0.25);
      if (score > best) {
        best = score;
        localStorage.setItem('slope_best', best);
        bestVal.textContent = best + 'm';
      }
      titleText.textContent = 'CRASHED!';
      subText.textContent = `You reached ${score}m. High Score: ${best}m`;
      startBtn.textContent = 'TRY AGAIN';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', startGame);

    function project(x, y, z) {
      const fov = 400;
      const scale = fov / (z + fov);
      return {
        x: w / 2 + x * scale,
        y: h / 2 + y * scale + 60,
        scale: scale
      };
    }

    let lastTime = performance.now();

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      // Clear Screen
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#060814');
      bgGrad.addColorStop(0.5, '#0f172a');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Distant Neon Grid lines
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.12)';
      ctx.lineWidth = 1;
      for (let i = -6; i <= 6; i++) {
        const p1 = project(i * 120, 200, 20);
        const p2 = project(i * 400, 200, 2500);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      if (state === 'PLAYING') {
        speed += dt * 18; // Gradual acceleration
        score = Math.floor(score + dt * (speed / 12));
        scoreVal.textContent = score + 'm';

        // Steering
        let steer = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) steer -= 1;
        if (keys['ArrowRight'] || keys['KeyD']) steer += 1;
        ball.vx += steer * 1400 * dt;
        ball.vx *= Math.pow(0.05, dt); // Damping
        ball.x += ball.vx * dt;
        ball.rot += (speed * dt) / 15;

        // Check if ball fell off track edge
        if (Math.abs(ball.x) > TRACK_WIDTH / 2 + 10) {
          gameOver();
        }

        // Move track segments towards ball
        for (let seg of trackSegments) {
          seg.z -= speed * dt;
        }

        // Recycle segments
        while (trackSegments[0].z < -SEG_LEN) {
          const lastZ = trackSegments[trackSegments.length - 1].z;
          const old = trackSegments.shift();
          old.z = lastZ + SEG_LEN;
          old.hasObstacle = Math.random() < Math.min(0.35 + score / 3000, 0.7);
          old.obsX = (Math.random() - 0.5) * (TRACK_WIDTH - 60);
          old.obsW = 40 + Math.random() * 40;
          trackSegments.push(old);
        }

        // Collision Check with obstacles
        for (let seg of trackSegments) {
          if (seg.hasObstacle) {
            const distZ = Math.abs(seg.z - ball.z);
            if (distZ < 25) {
              const obsLeft = seg.obsX - seg.obsW / 2;
              const obsRight = seg.obsX + seg.obsW / 2;
              if (ball.x + ball.radius > obsLeft && ball.x - ball.radius < obsRight) {
                gameOver();
              }
            }
          }
        }
      }

      // DRAW TRACK SEGMENTS (Back to front)
      for (let i = trackSegments.length - 1; i >= 0; i--) {
        const seg = trackSegments[i];
        if (seg.z < 20) continue;

        const zNear = seg.z;
        const zFar = seg.z + SEG_LEN;

        const p1 = project(-TRACK_WIDTH / 2, 80, zNear);
        const p2 = project(TRACK_WIDTH / 2, 80, zNear);
        const p3 = project(TRACK_WIDTH / 2, 80, zFar);
        const p4 = project(-TRACK_WIDTH / 2, 80, zFar);

        // Track surface
        ctx.fillStyle = i % 2 === 0 ? '#111827' : '#0f172a';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();

        // Neon border edges
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = Math.max(1, 3 * p1.scale);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.stroke();

        // Draw obstacle if present
        if (seg.hasObstacle) {
          const op1 = project(seg.obsX - seg.obsW / 2, 80, seg.z);
          const op2 = project(seg.obsX + seg.obsW / 2, 80, seg.z);
          const opTop1 = project(seg.obsX - seg.obsW / 2, 80 - seg.obsH, seg.z);
          const opTop2 = project(seg.obsX + seg.obsW / 2, 80 - seg.obsH, seg.z);

          // Obstacle glow & body
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(op1.x, op1.y);
          ctx.lineTo(op2.x, op2.y);
          ctx.lineTo(opTop2.x, opTop2.y);
          ctx.lineTo(opTop1.x, opTop1.y);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#fca5a5';
          ctx.lineWidth = 2 * op1.scale;
          ctx.stroke();
        }
      }

      // DRAW ROLLING NEON BALL
      const bp = project(ball.x, 80 - ball.radius, ball.z);
      const r = ball.radius * bp.scale;

      // Ball Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(bp.x, project(ball.x, 80, ball.z).y, r, r * 0.35, 0, 0, Math.PI * 2);
      ctx.fill();

      // Ball Glow
      const glow = ctx.createRadialGradient(bp.x, bp.y, r * 0.2, bp.x, bp.y, r * 1.5);
      glow.addColorStop(0, '#38bdf8');
      glow.addColorStop(0.6, '#0284c7');
      glow.addColorStop(1, 'rgba(2, 132, 199, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, r * 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Sphere
      const ballGrad = ctx.createRadialGradient(bp.x - r * 0.3, bp.y - r * 0.3, r * 0.1, bp.x, bp.y, r);
      ballGrad.addColorStop(0, '#ffffff');
      ballGrad.addColorStop(0.4, '#38bdf8');
      ballGrad.addColorStop(1, '#0369a1');
      ctx.fillStyle = ballGrad;
      ctx.beginPath();
      ctx.arc(bp.x, bp.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Rotating wireline on ball
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(bp.x, bp.y, r * 0.9, r * Math.sin(ball.rot) * 0.9, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
