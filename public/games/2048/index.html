<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2048 Classic DX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      user-select: none; touch-action: none; overflow: hidden;
    }
    .header {
      width: 380px; max-width: 90vw; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
    }
    h1 { font-size: 38px; font-weight: 900; color: #f59e0b; letter-spacing: -1px; }
    .scores { display: flex; gap: 8px; }
    .score-card {
      background: #1e293b; padding: 6px 14px; border-radius: 8px; text-align: center; min-width: 72px;
      border: 1px solid #334155;
    }
    .score-title { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
    .score-val { font-size: 18px; font-weight: 800; color: #fff; }
    .toolbar {
      width: 380px; max-width: 90vw; display: flex; justify-content: space-between; margin-bottom: 12px;
    }
    .btn {
      background: #334155; color: #f8fafc; border: none; padding: 8px 14px; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #475569; }
    .btn-primary { background: #f59e0b; color: #000; }
    .btn-primary:hover { background: #d97706; }
    #board {
      width: 380px; height: 380px; max-width: 90vw; max-height: 90vw; background: #1e293b;
      border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr);
      grid-gap: 12px; position: relative; border: 2px solid #334155;
    }
    .cell {
      background: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 800; transition: transform 0.1s, background-color 0.15s;
    }
    .tile-2 { background: #e2e8f0; color: #0f172a; }
    .tile-4 { background: #fef08a; color: #0f172a; }
    .tile-8 { background: #fdba74; color: #0f172a; }
    .tile-16 { background: #fb923c; color: #fff; }
    .tile-32 { background: #f87171; color: #fff; }
    .tile-64 { background: #ef4444; color: #fff; }
    .tile-128 { background: #38bdf8; color: #0f172a; font-size: 24px; box-shadow: 0 0 10px #38bdf8; }
    .tile-256 { background: #818cf8; color: #fff; font-size: 24px; box-shadow: 0 0 12px #818cf8; }
    .tile-512 { background: #a855f7; color: #fff; font-size: 24px; box-shadow: 0 0 15px #a855f7; }
    .tile-1024 { background: #ec4899; color: #fff; font-size: 20px; box-shadow: 0 0 18px #ec4899; }
    .tile-2048 { background: #eab308; color: #000; font-size: 20px; box-shadow: 0 0 25px #eab308; }
    .tile-super { background: #10b981; color: #fff; font-size: 18px; }
    #overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.9); border-radius: 12px;
      display: none; flex-direction: column; align-items: center; justify-content: center;
    }
    #overlay h2 { font-size: 32px; font-weight: 800; margin-bottom: 12px; }
    .instructions {
      margin-top: 14px; font-size: 12px; color: #64748b; text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-card">
        <div class="score-title">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-card">
        <div class="score-title">Best</div>
        <div id="best" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button id="undoBtn" class="btn">Undo Move</button>
    <button id="restartBtn" class="btn btn-primary">New Game</button>
  </div>

  <div id="board">
    <div id="overlay">
      <h2 id="overTitle">Game Over!</h2>
      <button id="retryBtn" class="btn btn-primary" style="padding: 10px 24px;">Try Again</button>
    </div>
  </div>

  <div class="instructions">Use Arrow Keys or Swipe on touch screen to merge numbers.</div>

  <script>
    let audioCtx = null;
    function playTone(freq, type='sine', dur=0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overTitle = document.getElementById('overTitle');
    const undoBtn = document.getElementById('undoBtn');
    const restartBtn = document.getElementById('restartBtn');
    const retryBtn = document.getElementById('retryBtn');

    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let prevGrid = null;
    let prevScore = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestEl.textContent = best;

    function initCells() {
      // create 16 cell divs
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          boardEl.appendChild(cell);
        }
      }
      boardEl.appendChild(overlay);
    }

    function spawnRandom() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length === 0) return;
      const spot = empty[Math.floor(Math.random() * empty.length)];
      grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        bestEl.textContent = best;
      }
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.textContent = val > 0 ? val : '';
          cell.className = 'cell ' + (val > 0 ? (val <= 2048 ? `tile-${val}` : 'tile-super') : '');
        }
      }
    }

    function saveState() {
      prevGrid = grid.map(row => [...row]);
      prevScore = score;
    }

    function undo() {
      if (!prevGrid) return;
      grid = prevGrid.map(row => [...row]);
      score = prevScore;
      prevGrid = null;
      overlay.style.display = 'none';
      render();
      playTone(350, 'triangle', 0.1);
    }

    function startNewGame() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      prevGrid = null;
      overlay.style.display = 'none';
      spawnRandom();
      spawnRandom();
      render();
    }

    function slide(row) {
      let arr = row.filter(val => val);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr[i + 1] = 0;
          playTone(400 + arr[i] * 0.5, 'sine', 0.08);
        }
      }
      arr = arr.filter(val => val);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      saveState();
      let changed = false;
      let newGrid = Array(4).fill(null).map(() => Array(4).fill(0));

      if (dir === 'left') {
        for (let r = 0; r < 4; r++) {
          newGrid[r] = slide(grid[r]);
          if (newGrid[r].some((val, c) => val !== grid[r][c])) changed = true;
        }
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) {
          newGrid[r] = slide(grid[r].slice().reverse()).reverse();
          if (newGrid[r].some((val, c) => val !== grid[r][c])) changed = true;
        }
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          let res = slide(col);
          for (let r = 0; r < 4; r++) {
            newGrid[r][c] = res[r];
            if (newGrid[r][c] !== grid[r][c]) changed = true;
          }
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          let res = slide(col);
          for (let r = 0; r < 4; r++) {
            newGrid[3 - r][c] = res[r];
            if (newGrid[3 - r][c] !== grid[3 - r][c]) changed = true;
          }
        }
      }

      if (changed) {
        grid = newGrid;
        spawnRandom();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
        }
      }
      overTitle.textContent = 'Game Over!';
      overlay.style.display = 'flex';
      playTone(180, 'sawtooth', 0.3);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
    });

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: false });

    restartBtn.addEventListener('click', startNewGame);
    retryBtn.addEventListener('click', startNewGame);
    undoBtn.addEventListener('click', undo);

    initCells();
    startNewGame();
  </script>
</body>
</html>
