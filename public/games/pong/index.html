<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Pong</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090d16; color: #fff; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #wrap {
      position: relative; width: 620px; height: 420px; max-width: 95vw;
      border: 2px solid #38bdf8; border-radius: 8px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    canvas { display: block; width: 100%; height: 100%; background: #030712; }
    #overlay {
      position: absolute; inset: 0; background: rgba(3, 7, 18, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    h1 { font-size: 32px; color: #38bdf8; margin-bottom: 8px; text-shadow: 0 0 10px #38bdf8; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .btn-group { display: flex; gap: 12px; }
    .btn {
      background: #0284c7; color: #fff; font-weight: bold; font-size: 14px; border: none;
      padding: 10px 22px; border-radius: 6px; cursor: pointer; transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    .hud {
      position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 60px;
      font-size: 36px; font-weight: bold; color: #38bdf8; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div id="p1Score">0</div>
      <div id="p2Score">0</div>
    </div>
    <canvas id="c" width="620" height="420"></canvas>
    <div id="overlay">
      <h1 id="overTitle">CYBER PONG</h1>
      <p id="overDesc">First player to 7 points wins!</p>
      <div class="btn-group">
        <button id="p1Btn" class="btn">1 PLAYER (VS AI)</button>
        <button id="p2Btn" class="btn" style="background:#8b5cf6;">2 PLAYERS (LOCAL)</button>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function beep(freq, dur=0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const p1Btn = document.getElementById('p1Btn');
    const p2Btn = document.getElementById('p2Btn');
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let mode = '1P';
    let isRunning = false;
    let p1Score = 0;
    let p2Score = 0;

    let p1 = { x: 20, y: 170, w: 10, h: 80, speed: 400 };
    let p2 = { x: 590, y: 170, w: 10, h: 80, speed: 400 };
    let ball = { x: 310, y: 210, r: 6, vx: 300, vy: 180 };

    let keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    function resetBall(servingP1) {
      ball.x = 310;
      ball.y = 210;
      ball.vx = (servingP1 ? -1 : 1) * 320;
      ball.vy = (Math.random() - 0.5) * 260;
    }

    function start(selectedMode) {
      mode = selectedMode;
      p1Score = 0;
      p2Score = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1.y = 170;
      p2.y = 170;
      resetBall(true);
      overlay.style.display = 'none';
      isRunning = true;
      beep(500, 0.1);
    }

    function gameOver(winner) {
      isRunning = false;
      beep(winner === 1 ? 880 : 200, 0.3);
      overTitle.textContent = `PLAYER ${winner} WINS!`;
      overDesc.textContent = `Final: ${p1Score} - ${p2Score}`;
      overlay.style.display = 'flex';
    }

    p1Btn.addEventListener('click', () => start('1P'));
    p2Btn.addEventListener('click', () => start('2P'));

    // Mouse control for Player 1
    canvas.addEventListener('mousemove', (e) => {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      const clientY = (e.clientY - rect.top) * scaleY;
      p1.y = Math.max(0, Math.min(canvas.height - p1.h, clientY - p1.h / 2));
    });

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (isRunning) {
        // Player 1 controls (W/S)
        if (keys['KeyW']) p1.y = Math.max(0, p1.y - p1.speed * dt);
        if (keys['KeyS']) p1.y = Math.min(canvas.height - p1.h, p1.y + p1.speed * dt);

        // Player 2 controls
        if (mode === '2P') {
          if (keys['ArrowUp']) p2.y = Math.max(0, p2.y - p2.speed * dt);
          if (keys['ArrowDown']) p2.y = Math.min(canvas.height - p2.h, p2.y + p2.speed * dt);
        } else {
          // AI Opponent with human-like lag
          const targetY = ball.y - p2.h / 2;
          const diff = targetY - p2.y;
          p2.y += Math.sign(diff) * Math.min(Math.abs(diff), 330 * dt);
          p2.y = Math.max(0, Math.min(canvas.height - p2.h, p2.y));
        }

        // Ball movement
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Top & Bottom walls
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = -ball.vy; beep(300); }
        if (ball.y + ball.r > canvas.height) { ball.y = canvas.height - ball.r; ball.vy = -ball.vy; beep(300); }

        // P1 Paddle collision
        if (ball.x - ball.r <= p1.x + p1.w && ball.x + ball.r >= p1.x &&
            ball.y >= p1.y && ball.y <= p1.y + p1.h) {
          ball.vx = Math.abs(ball.vx) * 1.05;
          const hit = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
          ball.vy = hit * 300;
          ball.x = p1.x + p1.w + ball.r;
          beep(600);
        }

        // P2 Paddle collision
        if (ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + p2.w &&
            ball.y >= p2.y && ball.y <= p2.y + p2.h) {
          ball.vx = -Math.abs(ball.vx) * 1.05;
          const hit = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
          ball.vy = hit * 300;
          ball.x = p2.x - ball.r;
          beep(600);
        }

        // Score Points
        if (ball.x < 0) {
          p2Score++;
          p2ScoreEl.textContent = p2Score;
          beep(220, 0.15);
          if (p2Score >= 7) gameOver(2);
          else resetBall(true);
        } else if (ball.x > canvas.width) {
          p1Score++;
          p1ScoreEl.textContent = p1Score;
          beep(750, 0.15);
          if (p1Score >= 7) gameOver(1);
          else resetBall(false);
        }
      }

      // RENDER
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
      ctx.fillStyle = mode === '2P' ? '#a855f7' : '#38bdf8';
      ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

      // Ball
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
