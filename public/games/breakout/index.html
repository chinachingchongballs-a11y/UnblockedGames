<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breakout DX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    .top-bar {
      width: 480px; max-width: 95vw; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }
    .brand { font-size: 22px; font-weight: 900; color: #ec4899; letter-spacing: 1px; }
    .stats { display: flex; gap: 16px; font-size: 13px; font-weight: 700; color: #94a3b8; }
    .stats span { color: #fff; font-size: 17px; margin-left: 4px; }
    #canvas-wrap {
      position: relative; width: 480px; height: 520px; max-width: 95vw; max-height: 90vh;
      border: 2px solid #ec4899; border-radius: 12px; overflow: hidden; box-shadow: 0 0 25px rgba(236, 72, 153, 0.2);
    }
    canvas { display: block; width: 100%; height: 100%; background: #070a12; }
    #overlay {
      position: absolute; inset: 0; background: rgba(11, 15, 25, 0.88); backdrop-filter: blur(4px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    h2 { font-size: 32px; font-weight: 900; color: #ec4899; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
    .btn {
      background: #ec4899; color: #fff; font-size: 15px; font-weight: 800; border: none;
      padding: 12px 32px; border-radius: 8px; cursor: pointer; transition: transform 0.15s;
    }
    .btn:hover { transform: scale(1.05); }
    .hint { margin-top: 10px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand">BREAKOUT DX</div>
    <div class="stats">
      <div>SCORE: <span id="score">0</span></div>
      <div>LIVES: <span id="lives">3</span></div>
      <div>BEST: <span id="best">0</span></div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c" width="480" height="520"></canvas>
    <div id="overlay">
      <h2 id="overTitle">BREAKOUT DX</h2>
      <p id="overDesc">Smash all neon bricks! Move mouse or use Arrow keys.</p>
      <button id="startBtn" class="btn">PLAY NOW</button>
      <div class="hint">Mouse / Touch / Left & Right arrows</div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function tone(freq, dur=0.06, type='sine') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let score = 0;
    let lives = 3;
    let best = parseInt(localStorage.getItem('breakout_best') || '0', 10);
    bestEl.textContent = best;
    let isRunning = false;

    let paddle = { x: 200, y: 480, w: 90, h: 12, speed: 450 };
    let balls = [];
    let bricks = [];
    let particles = [];

    const BRICK_ROWS = 6;
    const BRICK_COLS = 8;
    const BRICK_W = 52;
    const BRICK_H = 18;
    const BRICK_GAP = 6;
    const BRICK_OFFSET_TOP = 40;
    const BRICK_OFFSET_LEFT = (480 - (BRICK_COLS * (BRICK_W + BRICK_GAP) - BRICK_GAP)) / 2;

    const ROW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#a855f7'];

    function initBricks() {
      bricks = [];
      for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
          bricks.push({
            x: BRICK_OFFSET_LEFT + c * (BRICK_W + BRICK_GAP),
            y: BRICK_OFFSET_TOP + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W,
            h: BRICK_H,
            color: ROW_COLORS[r],
            alive: true,
            pts: (BRICK_ROWS - r) * 10
          });
        }
      }
    }

    function resetBall() {
      balls = [{
        x: paddle.x + paddle.w / 2,
        y: paddle.y - 10,
        vx: (Math.random() - 0.5) * 200,
        vy: -320,
        r: 6
      }];
    }

    function start() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      initBricks();
      paddle.x = 240 - paddle.w / 2;
      resetBall();
      overlay.style.display = 'none';
      isRunning = true;
      tone(440, 0.1);
    }

    function gameOver(won) {
      isRunning = false;
      if (score > best) {
        best = score;
        localStorage.setItem('breakout_best', best);
        bestEl.textContent = best;
      }
      tone(won ? 880 : 150, 0.3, won ? 'triangle' : 'sawtooth');
      overTitle.textContent = won ? 'YOU WIN!' : 'GAME OVER';
      overDesc.textContent = `Score: ${score} | High Score: ${best}`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', start);

    // Mouse / Touch movement
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const clientX = (e.clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, clientX - paddle.w / 2));
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const clientX = (e.touches[0].clientX - rect.left) * scaleX;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, clientX - paddle.w / 2));
    });

    let keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && !isRunning) start();
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      // Key steering
      if (keys['ArrowLeft'] || keys['KeyA']) {
        paddle.x = Math.max(0, paddle.x - paddle.speed * dt);
      }
      if (keys['ArrowRight'] || keys['KeyD']) {
        paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed * dt);
      }

      if (isRunning) {
        // Update balls
        for (let b of balls) {
          b.x += b.vx * dt;
          b.y += b.vy * dt;

          // Wall collision
          if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx; tone(260); }
          if (b.x + b.r > canvas.width) { b.x = canvas.width - b.r; b.vx = -b.vx; tone(260); }
          if (b.y - b.r < 0) { b.y = b.r; b.vy = -b.vy; tone(260); }

          // Paddle collision
          if (b.y + b.r >= paddle.y && b.y - b.r <= paddle.y + paddle.h) {
            if (b.x >= paddle.x && b.x <= paddle.x + paddle.w) {
              const hitOffset = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
              b.vx = hitOffset * 320;
              b.vy = -Math.abs(b.vy);
              b.y = paddle.y - b.r;
              tone(400, 0.06);
            }
          }

          // Brick collision
          for (let brick of bricks) {
            if (!brick.alive) continue;
            if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
                b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
              brick.alive = false;
              b.vy = -b.vy;
              score += brick.pts;
              scoreEl.textContent = score;
              tone(600 + brick.pts * 4, 0.08);

              // Spawn particles
              for (let p = 0; p < 6; p++) {
                particles.push({
                  x: brick.x + brick.w / 2,
                  y: brick.y + brick.h / 2,
                  vx: (Math.random() - 0.5) * 180,
                  vy: (Math.random() - 0.5) * 180,
                  color: brick.color,
                  life: 0.4
                });
              }
              break;
            }
          }
        }

        // Check Ball fell below screen
        balls = balls.filter(b => b.y - b.r < canvas.height);
        if (balls.length === 0) {
          lives--;
          livesEl.textContent = lives;
          tone(180, 0.2, 'sawtooth');
          if (lives <= 0) {
            gameOver(false);
          } else {
            resetBall();
          }
        }

        // Check Win
        if (bricks.every(b => !b.alive)) {
          gameOver(true);
        }

        // Update particles
        for (let p of particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
        }
        particles = particles.filter(p => p.life > 0);
      }

      // RENDER
      ctx.fillStyle = '#070a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bricks
      for (let b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 6;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
      ctx.shadowBlur = 0;

      // Draw Particles
      for (let p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      // Draw Paddle
      ctx.fillStyle = '#ec4899';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 10;
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.shadowBlur = 0;

      // Draw Balls
      for (let b of balls) {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
