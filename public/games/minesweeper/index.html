<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minesweeper Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    .board-frame {
      background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header-bar {
      background: #0f172a; border-radius: 8px; padding: 10px 16px; display: flex;
      justify-content: space-between; align-items: center; margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .lcd {
      background: #000; color: #ef4444; font-family: monospace; font-size: 24px; font-weight: bold;
      padding: 4px 10px; border-radius: 4px; letter-spacing: 2px;
    }
    .face-btn {
      font-size: 26px; cursor: pointer; background: none; border: none; transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.9); }
    #grid {
      display: grid; gap: 2px; background: #334155; padding: 2px; border-radius: 6px;
    }
    .cell {
      width: 32px; height: 32px; background: #334155; display: flex; align-items: center;
      justify-content: center; font-weight: 800; font-size: 15px; cursor: pointer;
      border-radius: 3px; transition: background 0.1s;
    }
    .cell:hover:not(.revealed) { background: #475569; }
    .cell.revealed { background: #0f172a; cursor: default; }
    .cell.mine { background: #dc2626; color: #fff; }
    .num-1 { color: #38bdf8; }
    .num-2 { color: #4ade80; }
    .num-3 { color: #f87171; }
    .num-4 { color: #818cf8; }
    .num-5 { color: #fb923c; }
    .mode-bar {
      display: flex; gap: 8px; margin-top: 14px; justify-content: center;
    }
    .m-btn {
      background: #334155; color: #94a3b8; border: none; padding: 6px 12px;
      border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .m-btn.active { background: #38bdf8; color: #082f49; font-weight: bold; }
  </style>
</head>
<body>
  <div class="board-frame">
    <div class="header-bar">
      <div id="mineCount" class="lcd">010</div>
      <button id="face" class="face-btn">🙂</button>
      <div id="timer" class="lcd">000</div>
    </div>
    <div id="grid"></div>
    <div class="mode-bar">
      <button id="btnEasy" class="m-btn active">Beginner (9x9)</button>
      <button id="btnMed" class="m-btn">Intermediate (12x12)</button>
      <button id="btnFlagMode" class="m-btn" style="background:#f59e0b;color:#000;">🚩 Flag: OFF</button>
    </div>
  </div>

  <script>
    let rows = 9, cols = 9, totalMines = 10;
    let board = [];
    let state = 'READY'; // READY, PLAYING, WON, LOST
    let flagMode = false;
    let timerVal = 0;
    let timerInterval = null;

    const gridEl = document.getElementById('grid');
    const mineCountEl = document.getElementById('mineCount');
    const timerEl = document.getElementById('timer');
    const faceEl = document.getElementById('face');
    const btnEasy = document.getElementById('btnEasy');
    const btnMed = document.getElementById('btnMed');
    const btnFlagMode = document.getElementById('btnFlagMode');

    function updateLcd(el, num) {
      el.textContent = String(Math.max(0, Math.min(999, num))).padStart(3, '0');
    }

    function initGame() {
      state = 'READY';
      clearInterval(timerInterval);
      timerVal = 0;
      updateLcd(timerEl, 0);
      updateLcd(mineCountEl, totalMines);
      faceEl.textContent = '🙂';

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      gridEl.innerHTML = '';
      board = [];

      for (let r = 0; r < rows; r++) {
        board[r] = [];
        for (let c = 0; c < cols; c++) {
          const cell = {
            r, c,
            mine: false,
            revealed: false,
            flagged: false,
            count: 0,
            el: document.createElement('div')
          };
          cell.el.className = 'cell';
          cell.el.addEventListener('click', () => handleClick(r, c));
          cell.el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });
          board[r][c] = cell;
          gridEl.appendChild(cell.el);
        }
      }
    }

    function plantMines(firstR, firstC) {
      let planted = 0;
      while (planted < totalMines) {
        let r = Math.floor(Math.random() * rows);
        let c = Math.floor(Math.random() * cols);
        if (!board[r][c].mine && !(Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1)) {
          board[r][c].mine = true;
          planted++;
        }
      }

      // calculate counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!board[r][c].mine) {
            let cnt = 0;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) cnt++;
              }
            }
            board[r][c].count = cnt;
          }
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerVal++;
        updateLcd(timerEl, timerVal);
      }, 1000);
    }

    function toggleFlag(r, c) {
      if (state === 'WON' || state === 'LOST') return;
      const cell = board[r][c];
      if (cell.revealed) return;
      cell.flagged = !cell.flagged;
      cell.el.textContent = cell.flagged ? '🚩' : '';
      const flagCount = board.flat().filter(c => c.flagged).length;
      updateLcd(mineCountEl, totalMines - flagCount);
    }

    function handleClick(r, c) {
      if (flagMode) {
        toggleFlag(r, c);
        return;
      }
      if (state === 'WON' || state === 'LOST') return;
      const cell = board[r][c];
      if (cell.flagged || cell.revealed) return;

      if (state === 'READY') {
        state = 'PLAYING';
        plantMines(r, c);
        startTimer();
      }

      reveal(r, c);
      checkWin();
    }

    function reveal(r, c) {
      if (r < 0 || r >= rows || c < 0 || c >= cols) return;
      const cell = board[r][c];
      if (cell.revealed || cell.flagged) return;

      cell.revealed = true;
      cell.el.classList.add('revealed');

      if (cell.mine) {
        cell.el.classList.add('mine');
        cell.el.textContent = '💣';
        gameOver(false);
        return;
      }

      if (cell.count > 0) {
        cell.el.textContent = cell.count;
        cell.el.classList.add(`num-${cell.count}`);
      } else {
        // flood fill
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function checkWin() {
      if (state !== 'PLAYING') return;
      const unrevealed = board.flat().filter(c => !c.revealed);
      if (unrevealed.length === totalMines) {
        gameOver(true);
      }
    }

    function gameOver(won) {
      state = won ? 'WON' : 'LOST';
      clearInterval(timerInterval);
      faceEl.textContent = won ? '😎' : '😵';

      if (!won) {
        board.flat().forEach(c => {
          if (c.mine) {
            c.el.classList.add('revealed', 'mine');
            c.el.textContent = '💣';
          }
        });
      }
    }

    faceEl.addEventListener('click', initGame);
    btnEasy.addEventListener('click', () => {
      rows = 9; cols = 9; totalMines = 10;
      btnEasy.classList.add('active');
      btnMed.classList.remove('active');
      initGame();
    });
    btnMed.addEventListener('click', () => {
      rows = 12; cols = 12; totalMines = 22;
      btnMed.classList.add('active');
      btnEasy.classList.remove('active');
      initGame();
    });
    btnFlagMode.addEventListener('click', () => {
      flagMode = !flagMode;
      btnFlagMode.textContent = flagMode ? '🚩 Flag: ON' : '🚩 Flag: OFF';
      btnFlagMode.style.background = flagMode ? '#22c55e' : '#f59e0b';
    });

    initGame();
  </script>
</body>
</html>
