<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Space Invaders Retro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617; color: #f8fafc; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #wrap {
      position: relative; width: 480px; height: 520px; max-width: 95vw;
      border: 2px solid #22c55e; border-radius: 8px; box-shadow: 0 0 20px rgba(34, 197, 94, 0.2);
    }
    canvas { display: block; width: 100%; height: 100%; background: #000; }
    #overlay {
      position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    h1 { font-size: 28px; color: #22c55e; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
    .btn {
      background: #22c55e; color: #052e16; font-weight: bold; font-size: 14px; border: none;
      padding: 10px 28px; border-radius: 4px; cursor: pointer;
    }
    .hud {
      position: absolute; top: 10px; left: 16px; right: 16px; display: flex; justify-content: space-between;
      color: #22c55e; font-size: 14px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>LIVES: <span id="lives">3</span></div>
      <div>BEST: <span id="best">0</span></div>
    </div>
    <canvas id="c" width="480" height="520"></canvas>
    <div id="overlay">
      <h1 id="overTitle">SPACE INVADERS</h1>
      <p id="overDesc">◄ ►: Move | Space: Fire Laser</p>
      <button id="startBtn" class="btn">DEFEND EARTH</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function sound(freq, dur=0.06, type='square') {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let isRunning = false;
    let score = 0;
    let lives = 3;
    let best = parseInt(localStorage.getItem('invaders_best') || '0', 10);
    bestEl.textContent = best;

    let player = { x: 220, y: 470, w: 26, h: 14, speed: 280 };
    let playerBullet = null;
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1;
    let alienStepTimer = 0;
    let alienStepInterval = 0.65;
    let bunkers = [];
    let keys = {};

    function initAliens() {
      aliens = [];
      const rows = 4;
      const cols = 8;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          aliens.push({
            x: 60 + c * 44,
            y: 60 + r * 34,
            w: 24,
            h: 18,
            color: r === 0 ? '#ef4444' : (r < 2 ? '#f59e0b' : '#38bdf8'),
            alive: true,
            pts: (4 - r) * 10
          });
        }
      }
      alienDir = 1;
      alienStepInterval = 0.65;
    }

    function initBunkers() {
      bunkers = [];
      for (let i = 0; i < 3; i++) {
        bunkers.push({
          x: 70 + i * 140,
          y: 410,
          w: 46,
          h: 24,
          hp: 8
        });
      }
    }

    function start() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      player.x = 220;
      playerBullet = null;
      alienBullets = [];
      initAliens();
      initBunkers();
      overlay.style.display = 'none';
      isRunning = true;
      sound(440, 0.1);
    }

    function gameOver(won) {
      isRunning = false;
      if (score > best) {
        best = score;
        localStorage.setItem('invaders_best', best);
        bestEl.textContent = best;
      }
      sound(won ? 880 : 120, 0.3, won ? 'sine' : 'sawtooth');
      overTitle.textContent = won ? 'VICTORY!' : 'GAME OVER';
      overDesc.textContent = `Score: ${score} | High Score: ${best}`;
      startBtn.textContent = 'RETRY';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', start);
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        if (isRunning && !playerBullet) {
          playerBullet = { x: player.x + player.w / 2, y: player.y, vy: -500 };
          sound(800, 0.05, 'triangle');
        } else if (!isRunning) {
          start();
        }
      }
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (isRunning) {
        // Player move
        if (keys['ArrowLeft'] || keys['KeyA']) player.x = Math.max(10, player.x - player.speed * dt);
        if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(canvas.width - player.w - 10, player.x + player.speed * dt);

        // Player bullet
        if (playerBullet) {
          playerBullet.y += playerBullet.vy * dt;
          if (playerBullet.y < 0) playerBullet = null;
        }

        // Alien Step
        alienStepTimer += dt;
        if (alienStepTimer >= alienStepInterval) {
          alienStepTimer = 0;
          let hitEdge = false;
          for (let a of aliens) {
            if (!a.alive) continue;
            if ((alienDir === 1 && a.x + a.w >= canvas.width - 20) ||
                (alienDir === -1 && a.x <= 20)) {
              hitEdge = true;
              break;
            }
          }

          if (hitEdge) {
            alienDir = -alienDir;
            for (let a of aliens) a.y += 16;
          } else {
            for (let a of aliens) a.x += alienDir * 12;
          }

          sound(160 + (aliens.filter(a => a.alive).length * 4), 0.04, 'square');

          // Alien Random Bullet
          const living = aliens.filter(a => a.alive);
          if (living.length > 0 && Math.random() < 0.6) {
            const shooter = living[Math.floor(Math.random() * living.length)];
            alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, vy: 220 });
          }
        }

        // Alien Bullets
        for (let b of alienBullets) {
          b.y += b.vy * dt;
          // Player hit
          if (b.x > player.x && b.x < player.x + player.w && b.y > player.y && b.y < player.y + player.h) {
            b.dead = true;
            lives--;
            livesEl.textContent = lives;
            sound(100, 0.25, 'sawtooth');
            if (lives <= 0) gameOver(false);
          }
          // Bunker hit
          for (let bunk of bunkers) {
            if (bunk.hp > 0 && b.x > bunk.x && b.x < bunk.x + bunk.w && b.y > bunk.y && b.y < bunk.y + bunk.h) {
              b.dead = true;
              bunk.hp--;
            }
          }
        }
        alienBullets = alienBullets.filter(b => !b.dead && b.y < canvas.height);

        // Player bullet vs Aliens & Bunkers
        if (playerBullet) {
          // Vs Aliens
          for (let a of aliens) {
            if (!a.alive) continue;
            if (playerBullet.x > a.x && playerBullet.x < a.x + a.w &&
                playerBullet.y > a.y && playerBullet.y < a.y + a.h) {
              a.alive = false;
              playerBullet = null;
              score += a.pts;
              scoreEl.textContent = score;
              sound(350, 0.08, 'sawtooth');
              alienStepInterval = Math.max(0.12, alienStepInterval * 0.96);
              break;
            }
          }

          // Vs Bunkers
          if (playerBullet) {
            for (let bunk of bunkers) {
              if (bunk.hp > 0 && playerBullet.x > bunk.x && playerBullet.x < bunk.x + bunk.w &&
                  playerBullet.y > bunk.y && playerBullet.y < bunk.y + bunk.h) {
                playerBullet = null;
                bunk.hp--;
                break;
              }
            }
          }
        }

        // Check if aliens reached bottom
        for (let a of aliens) {
          if (a.alive && a.y + a.h >= player.y) {
            gameOver(false);
            break;
          }
        }

        // Check Win
        if (aliens.every(a => !a.alive)) {
          gameOver(true);
        }
      }

      // RENDER
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Player
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillRect(player.x + 10, player.y - 5, 6, 5);

      // Player Bullet
      if (playerBullet) {
        ctx.fillStyle = '#4ade80';
        ctx.fillRect(playerBullet.x - 1, playerBullet.y, 3, 8);
      }

      // Alien Bullets
      ctx.fillStyle = '#ef4444';
      for (let b of alienBullets) {
        ctx.fillRect(b.x - 1.5, b.y, 3, 7);
      }

      // Aliens
      for (let a of aliens) {
        if (!a.alive) continue;
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x, a.y, a.w, a.h);
        // Eyes
        ctx.fillStyle = '#020617';
        ctx.fillRect(a.x + 4, a.y + 4, 3, 4);
        ctx.fillRect(a.x + a.w - 7, a.y + 4, 3, 4);
      }

      // Bunkers
      for (let b of bunkers) {
        if (b.hp <= 0) continue;
        const alpha = b.hp / 8;
        ctx.fillStyle = `rgba(34, 197, 94, ${alpha})`;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
