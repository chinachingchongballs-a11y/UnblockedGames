<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dino Chrome Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a; color: #f8fafc; font-family: monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;
      overflow: hidden; user-select: none;
    }
    #game-wrap {
      position: relative; width: 600px; height: 260px; max-width: 95vw;
      border: 2px solid #64748b; border-radius: 8px; overflow: hidden; background: #f8fafc;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    h2 { font-size: 26px; margin-bottom: 6px; color: #38bdf8; }
    p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
    .btn {
      background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 14px; border: none;
      padding: 10px 24px; border-radius: 6px; cursor: pointer;
    }
    .hud {
      position: absolute; top: 10px; right: 16px; font-size: 16px; font-weight: bold; color: #334155;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <div class="hud">
      HI <span id="hiVal">00000</span> <span id="scoreVal">00000</span>
    </div>
    <canvas id="c" width="600" height="260"></canvas>
    <div id="overlay">
      <h2 id="overTitle">T-REX JUMP</h2>
      <p id="overDesc">Press Space / Up to jump, Down to duck!</p>
      <button id="startBtn" class="btn">START</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function beep(freq, dur=0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.06, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const scoreVal = document.getElementById('scoreVal');
    const hiVal = document.getElementById('hiVal');
    const overTitle = document.getElementById('overTitle');
    const overDesc = document.getElementById('overDesc');

    let isRunning = false;
    let score = 0;
    let best = parseInt(localStorage.getItem('dino_best') || '0', 10);
    hiVal.textContent = String(best).padStart(5, '0');

    let dino = { x: 50, y: 190, w: 32, h: 42, vy: 0, isGrounded: true, isDucking: false };
    const GRAVITY = 1400;
    const JUMP_FORCE = -480;
    let speed = 300;
    let obstacles = [];
    let obsTimer = 0;

    function jump() {
      if (!isRunning) { start(); return; }
      if (dino.isGrounded) {
        dino.vy = JUMP_FORCE;
        dino.isGrounded = false;
        beep(587, 0.08);
      }
    }

    function start() {
      score = 0;
      speed = 320;
      obstacles = [];
      obsTimer = 1.0;
      dino.y = 190;
      dino.vy = 0;
      dino.isGrounded = true;
      dino.isDucking = false;
      overlay.style.display = 'none';
      isRunning = true;
      beep(440, 0.08);
    }

    function gameOver() {
      isRunning = false;
      beep(150, 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('dino_best', best);
        hiVal.textContent = String(best).padStart(5, '0');
      }
      overTitle.textContent = 'GAME OVER';
      overDesc.textContent = `Score: ${score}`;
      startBtn.textContent = 'RESTART';
      overlay.style.display = 'flex';
    }

    startBtn.addEventListener('click', start);
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
      if (e.code === 'ArrowDown') { dino.isDucking = true; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowDown') dino.isDucking = false;
    });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });

    let lastTime = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (isRunning) {
        score += Math.floor(dt * 15);
        scoreVal.textContent = String(score).padStart(5, '0');
        speed += dt * 8;

        // Dino Physics
        if (!dino.isGrounded) {
          dino.vy += GRAVITY * dt;
          dino.y += dino.vy * dt;
          if (dino.y >= 190) {
            dino.y = 190;
            dino.vy = 0;
            dino.isGrounded = true;
          }
        }

        // Spawn obstacles
        obsTimer -= dt;
        if (obsTimer <= 0) {
          obsTimer = 1.2 + Math.random() * 1.5;
          const isBird = score > 150 && Math.random() < 0.35;
          if (isBird) {
            obstacles.push({
              x: 620,
              y: 155,
              w: 30,
              h: 22,
              type: 'bird'
            });
          } else {
            const h = 34 + Math.random() * 16;
            obstacles.push({
              x: 620,
              y: 232 - h,
              w: 20 + Math.random() * 14,
              h: h,
              type: 'cactus'
            });
          }
        }

        // Update obstacles
        const curH = dino.isDucking ? 24 : 42;
        const curY = dino.isDucking ? 208 : dino.y;
        for (let obs of obstacles) {
          obs.x -= speed * dt;

          // Box collision
          if (dino.x + dino.w > obs.x && dino.x < obs.x + obs.w &&
              curY + curH > obs.y && curY < obs.y + obs.h) {
            gameOver();
            break;
          }
        }
        obstacles = obstacles.filter(o => o.x + o.w > -20);
      }

      // RENDER
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground Line
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 232);
      ctx.lineTo(canvas.width, 232);
      ctx.stroke();

      // Draw Dino
      ctx.fillStyle = '#334155';
      const curH = dino.isDucking ? 24 : 42;
      const curY = dino.isDucking ? 208 : dino.y;
      ctx.fillRect(dino.x, curY, dino.w, curH);

      // Eye
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(dino.x + 20, curY + 4, 4, 4);

      // Draw Obstacles
      for (let o of obstacles) {
        ctx.fillStyle = o.type === 'bird' ? '#ef4444' : '#15803d';
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
